[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastic-trade-research"
version = "0.1.0"
description = "Research-oriented inverse SDE modeling scaffold for stock time series"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Research Team" }]
dependencies = []

[project.optional-dependencies]
research = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "matplotlib>=3.7",
  "pydantic>=2.0",
  "requests>=2.31",
  "yfinance>=0.2.40",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
stoch-research = "stochastic_trade.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
